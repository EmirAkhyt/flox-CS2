<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Flox v2.0 — Кейс-симулятор</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; user-select: none; }
    .header { display: flex; justify-content: space-between; align-items: center; max-width: 720px; margin: 0 auto 15px; background: #1e293b; padding: 15px 25px; border-radius: 12px; border: 1px solid #334155; }
    .brand { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .balance { font-size: 22px; font-weight: bold; color: #4ade80; }

    /* Выбор кейсов */
    .cases-bar { display: flex; justify-content: center; gap: 10px; max-width: 720px; margin: 0 auto 15px; }
    .case-tab { flex: 1; padding: 12px; background: #1e293b; border: 2px solid #334155; border-radius: 10px; color: white; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
    .case-tab:hover { border-color: #64748b; }
    .case-tab.active { border-color: #f59e0b; background: #29220a; color: #fbbf24; }

    /* Рулетка */
    .roulette-box { position: relative; width: 680px; max-width: 100%; height: 150px; margin: 0 auto 18px; background: #1e293b; border: 3px solid #f59e0b; border-radius: 12px; overflow: hidden; }
    .pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: #ef4444; z-index: 10; }
    .tape { display: flex; height: 100%; align-items: center; }
    .item { min-width: 135px; height: 130px; margin: 0 5px; border-radius: 8px; background: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 5px solid gray; font-size: 11px; font-weight: bold; }
    .item img { width: 105px; height: 65px; object-fit: contain; margin-bottom: 6px; }

    /* Редкость */
    .blue { border-color: #3b82f6; }
    .purple { border-color: #a855f7; }
    .pink { border-color: #ec4899; }
    .red { border-color: #ef4444; }
    .gold { border-color: #eab308; background: #29220a; }

    /* Кнопки действий */
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 10px; }
    .btn { padding: 13px 22px; font-size: 15px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; background: #f59e0b; color: #000; }
    .btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .bonus-btn { background: #2563eb; color: white; }
    .contract-btn { background: #a855f7; color: white; }

    /* Инвентарь */
    .inventory { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 720px; margin: 15px auto; }
    .inv-item { width: 135px; background: #1e293b; padding: 10px; border-radius: 8px; border-bottom: 4px solid gray; font-size: 11px; cursor: pointer; transition: 0.15s; }
    .inv-item:hover { transform: translateY(-3px); background: #273549; }
    .inv-item img { width: 95px; height: 55px; object-fit: contain; }
  </style>
</head>
<body>

  <div class="header">
    <div><span class="brand">⚡ Flox v2.0</span> &nbsp;|&nbsp; <span id="current-case-name">Кейс «Революция»</span></div>
    <div class="balance">Баланс: <span id="bal">1000</span> ₽</div>
  </div>

  <!-- Переключатель кейсов -->
  <div class="cases-bar">
    <button class="case-tab" id="tab-cheap">📦 Новичок (100 ₽)</button>
    <button class="case-tab active" id="tab-mid">🔥 Революция (250 ₽)</button>
    <button class="case-tab" id="tab-vip">👑 Элитный (1000 ₽)</button>
  </div>

  <div class="roulette-box">
    <div class="pointer"></div>
    <div class="tape" id="tape"></div>
  </div>

  <div class="actions">
    <button class="btn" id="open-btn">Открыть кейс (250 ₽)</button>
    <button class="btn contract-btn" id="contract-btn">⚗️ Контракт (5 синих → 1 фиол.)</button>
    <button class="btn bonus-btn" id="bonus-btn">+ 500 ₽ (Бонус)</button>
  </div>

  <h3 style="color:#94a3b8;margin-top:20px;">Твой инвентарь (кликни на скин, чтобы продать):</h3>
  <div class="inventory" id="inv"></div>

  <script src="game.js"></script>
</body>
</html>
